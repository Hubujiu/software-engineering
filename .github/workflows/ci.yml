name: Prototype checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js && node --check demo/web/portal.js
      - name: Go formatting
        run: test -z "$(gofmt -l demo/api/main.go tools/analyze-go.go)"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Start isolated sample
        run: |
          python -m observatory --data-dir /tmp/atlas-ci-data > /tmp/atlas.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/api/graph >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/atlas.log
          exit 1
      - name: Browser end-to-end
        run: python tests/browser_smoke.py --screenshots test-results
      - name: Export review artifact
        run: python tools/export_preview.py --out dist/atlas-preview.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-review
          path: |
            dist/atlas-preview.html
            test-results/
            /tmp/atlas.log
